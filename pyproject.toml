[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sig-cloud-control"
version = "0.5.1"
description = "Control Sigenergy battery via Sigen Cloud"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Mike Lawther", email = "mike.lawther@gmail.com" }]
keywords = ["sigenergy", "sigen", "battery", "solar", "energy-storage", "iot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=46,<51",
  "httpx~=0.28",
  "platformdirs>=4.0",
  "pydantic-settings>=2.14.0",
  "pydantic[email]~=2.12",
  "tomli-w>=1.2.0",
  "typer~=0.24",
]

[project.urls]
Homepage = "https://github.com/lawther/sig-cloud-control"
Repository = "https://github.com/lawther/sig-cloud-control"
Issues = "https://github.com/lawther/sig-cloud-control/issues"

[project.scripts]
sig-cloud-control = "sig_cloud_control.cli_app:app"

[dependency-groups]
dev = [
  "ml-lints>=0.12.4",
  "pytest~=9.0",
  "pytest-asyncio~=1.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
  "ty>=0.0.85",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sig_cloud_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sig_cloud_control --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["sig_cloud_control"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "def __repr__",
  "raise NotImplementedError",
]
